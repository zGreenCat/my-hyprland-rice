<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'JetBrainsMono Nerd Font', monospace;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════
           🌓 CONTENEDOR DE LA TARJETA CON PERSPECTIVA 3D
           ═══════════════════════════════════════════════════════ */
        .card-container {
            width: 120px;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
        }

        /* ═══════════════════════════════════════════════════════
           🔄 TARJETA CON FLIP 3D
           ═══════════════════════════════════════════════════════ */
        .theme-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .card-container:hover .theme-card {
            transform: scale(1.05);
        }

        /* Estado flipped (light mode) */
        .card-container.flipped .theme-card {
            transform: rotateY(180deg);
        }

        /* ═══════════════════════════════════════════════════════
           🌙 CARA OSCURA (FRENTE)
           ═══════════════════════════════════════════════════════ */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .dark-mode {
            background: linear-gradient(180deg, 
                #0a0e27 0%,
                #1a1f3a 40%,
                #2d1b3d 100%
            );
        }

        /* ☀️ CARA CLARA (REVERSO) */
        .light-mode {
            background: linear-gradient(180deg, 
                #87CEEB 0%,
                #B0E2FF 50%,
                #90EE90 100%
            );
            transform: rotateY(180deg);
        }

        /* ═══════════════════════════════════════════════════════
           🌙 ELEMENTOS DE NOCHE
           ═══════════════════════════════════════════════════════ */
        .moon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            background: #FFF9E6;
            border-radius: 50%;
            box-shadow: 
                0 0 20px rgba(255, 249, 230, 0.6),
                inset -5px -2px 0 rgba(0, 0, 0, 0.1);
            animation: moonGlow 3s ease-in-out infinite;
        }

        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 249, 230, 0.6); }
            50% { box-shadow: 0 0 30px rgba(255, 249, 230, 0.9); }
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 60%;
            top: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }

        .star:nth-child(1) { top: 15%; left: 20%; animation-delay: 0s; }
        .star:nth-child(2) { top: 25%; left: 70%; animation-delay: 0.5s; }
        .star:nth-child(3) { top: 35%; left: 40%; animation-delay: 1s; }
        .star:nth-child(4) { top: 10%; left: 60%; animation-delay: 1.5s; }
        .star:nth-child(5) { top: 30%; left: 85%; animation-delay: 0.8s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25px;
            background: linear-gradient(180deg, #1a1f3a 0%, #0d1117 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* ═══════════════════════════════════════════════════════
           ☀️ ELEMENTOS DE DÍA
           ═══════════════════════════════════════════════════════ */
        .sun {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 35px;
            height: 35px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 
                0 0 30px rgba(255, 215, 0, 0.8),
                0 0 60px rgba(255, 215, 0, 0.4);
            animation: sunPulse 3s ease-in-out infinite;
        }

        @keyframes sunPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .sun::before,
        .sun::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
            opacity: 0.3;
        }

        .sun::before {
            transform: translate(-50%, -50%) scale(1.3);
        }

        .sun::after {
            transform: translate(-50%, -50%) scale(1.6);
        }

        .clouds {
            position: absolute;
            width: 100%;
            height: 60%;
            top: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50px;
            animation: cloudFloat 10s ease-in-out infinite;
        }

        .cloud1 {
            width: 40px;
            height: 12px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .cloud2 {
            width: 50px;
            height: 15px;
            top: 35%;
            left: 60%;
            animation-delay: 3s;
        }

        .cloud3 {
            width: 35px;
            height: 10px;
            top: 50%;
            left: 30%;
            animation-delay: 6s;
        }

        @keyframes cloudFloat {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }

        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25px;
            background: linear-gradient(180deg, #90EE90 0%, #32CD32 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* ═══════════════════════════════════════════════════════
           📝 INDICADOR DE TEMA ACTUAL
           ═══════════════════════════════════════════════════════ */
        .theme-label {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            letter-spacing: 1px;
        }

        /* ═══════════════════════════════════════════════════════
           ✨ EFECTO DE CLICK
           ═══════════════════════════════════════════════════════ */
        .card-container.clicking .theme-card {
            animation: clickPulse 0.3s ease-out;
        }

        @keyframes clickPulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        .card-container.flipped.clicking .theme-card {
            animation: clickPulseFlipped 0.3s ease-out;
        }

        @keyframes clickPulseFlipped {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(0.95); }
            100% { transform: rotateY(180deg) scale(1); }
        }
    </style>
</head>
<body>
    <div class="card-container" id="themeCard">
        <div class="theme-card">
            <!-- 🌙 CARA OSCURA -->
            <div class="card-face dark-mode">
                <div class="moon"></div>
                <div class="stars">
                    <div class="star"></div>
                    <div class="star"></div>
                    <div class="star"></div>
                    <div class="star"></div>
                    <div class="star"></div>
                </div>
                <div class="ground"></div>
            </div>

            <!-- ☀️ CARA CLARA -->
            <div class="card-face light-mode">
                <div class="sun"></div>
                <div class="clouds">
                    <div class="cloud cloud1"></div>
                    <div class="cloud cloud2"></div>
                    <div class="cloud cloud3"></div>
                </div>
                <div class="grass"></div>
            </div>
        </div>
        <div class="theme-label" id="themeLabel">Dark Mode</div>
    </div>

    <script>
        const card = document.getElementById('themeCard');
        const label = document.getElementById('themeLabel');
        
        // Leer estado del tema desde archivo
        async function loadTheme() {
            try {
                const response = await fetch('file:///home/' + 
                    (window.location.pathname.split('/')[2] || 'zgreencat') + 
                    '/.config/hypr/.theme-mode');
                const theme = await response.text();
                
                if (theme.trim() === 'light') {
                    card.classList.add('flipped');
                    label.textContent = 'Light Mode';
                }
            } catch (e) {
                // Default dark
                console.log('Using default dark theme');
            }
        }

        // Toggle tema
        card.addEventListener('click', () => {
            const isLight = card.classList.contains('flipped');
            const newTheme = isLight ? 'dark' : 'light';
            
            // Animación de click
            card.classList.add('clicking');
            setTimeout(() => card.classList.remove('clicking'), 300);
            
            // Flip card
            card.classList.toggle('flipped');
            label.textContent = isLight ? 'Dark Mode' : 'Light Mode';
            
            // Llamar al script bash para cambiar tema
            window.location.href = `theme-toggle://switch?mode=${newTheme}`;
        });

        // Cargar tema al inicio
        loadTheme();
    </script>
</body>
</html>
