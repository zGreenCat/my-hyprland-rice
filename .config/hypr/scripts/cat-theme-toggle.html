<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Theme Toggle</title>
    <style>
        /* ═══════════════════════════════════════════════════════════
           RESET Y BODY
           ═══════════════════════════════════════════════════════════ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════════════════════════
           CONTENEDOR PRINCIPAL CON FLIP 3D
           ═══════════════════════════════════════════════════════════ */
        .toggle-wrapper {
            perspective: 1200px;
            cursor: pointer;
        }

        .toggle-wrapper:hover {
            transform: scale(1.02);
            transition: transform 0.2s ease;
        }

        /* Contenedor de escenas con flip */
        .scenes-container {
            position: relative;
            width: 350px;
            height: 530px;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Flip cuando está en modo light */
        body.light .scenes-container {
            transform: rotateY(180deg);
        }

        /* ═══════════════════════════════════════════════════════════
           ESCENAS (frente y reverso)
           ═══════════════════════════════════════════════════════════ */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
        }

        .scene--dark {
            background-color: transparent;
            transform: rotateY(0deg);
        }

        .scene--light {
            background-color: transparent;
            transform: rotateY(180deg);
        }

        /* ═══════════════════════════════════════════════════════════
           CONTAINER (del CSS original - IDÉNTICO)
           ═══════════════════════════════════════════════════════════ */
        .container {
            height: 530px;
            width: 350px;
            position: absolute;
            margin: auto;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
        }

        /* ═══════════════════════════════════════════════════════════
           WINDOW (del CSS original - IDÉNTICO)
           ═══════════════════════════════════════════════════════════ */
        .window {
            width: 250px;
            height: 390px;
            border-left: 5px solid #439abf;
            border-right: 5px solid #439abf;
            position: relative;
            top: 20px;
            left: 45px;
        }

        /* Fondo de ventana - Dark mode */
        .scene--dark .window {
            background-color: #29467a;
        }

        /* Fondo de ventana - Light mode */
        .scene--light .window {
            background: linear-gradient(180deg, #87ceeb 0%, #ffd89b 50%, #ffa751 100%);
        }

        .window:before,
        .window:after {
            content: "";
            position: absolute;
            background: linear-gradient(#439abf 50%, #2d2623 50%);
        }

        .window:after {
            height: 15px;
            width: 260px;
            left: -5px;
            top: 200px;
        }

        .window:before {
            height: 15px;
            width: 310px;
            left: -30px;
            bottom: -15px;
        }

        /* ═══════════════════════════════════════════════════════════
           MONTAÑAS (solo modo dark - del CSS original - IDÉNTICO)
           ═══════════════════════════════════════════════════════════ */
        .mountain-1 {
            height: 0;
            width: 0;
            border-bottom: 60px solid #22366d;
            border-right: 20px solid transparent;
            position: absolute;
            bottom: 0;
        }

        .mountain-1:before,
        .mountain-1:after,
        .mountain-2:before {
            content: "";
            position: absolute;
            height: 0;
            width: 0;
            border-bottom: 60px solid #22366d;
            border-right: 20px solid transparent;
            border-left: 20px solid transparent;
        }

        .mountain-1:before {
            bottom: -60px;
            left: 5px;
        }

        .mountain-1:after {
            bottom: -60px;
            left: 35px;
        }

        .mountain-2 {
            position: absolute;
            height: 0;
            width: 0;
            border-bottom: 60px solid #22366d;
            border-left: 20px solid transparent;
            right: 0;
            bottom: 0;
        }

        .mountain-2:before {
            bottom: -60px;
            right: 10px;
        }

        /* ═══════════════════════════════════════════════════════════
           GATO (del CSS original - IDÉNTICO)
           ═══════════════════════════════════════════════════════════ */
        .kitty {
            height: 140px;
            width: 50px;
            position: absolute;
            bottom: -15px;
            left: 95px;
            border-radius: 40px 40px 0 0;
        }

        /* Color del gato - Dark mode */
        .scene--dark .kitty {
            background-color: #2d2623;
        }

        .scene--dark .kitty:before {
            background-color: #2d2623;
        }

        .scene--dark .kitty:after {
            background-color: #2d2623;
        }

        /* Color del gato - Light mode */
        .scene--light .kitty {
            background-color: #ff8c42;
        }

        .scene--light .kitty:before {
            background-color: #ff8c42;
        }

        .scene--light .kitty:after {
            background-color: #ff8c42;
        }

        .kitty:before {
            content: "";
            position: absolute;
            height: 80px;
            width: 40px;
            border-radius: 0 80px 80px 0;
            bottom: 0;
            left: 43px;
        }

        .kitty:after {
            content: "";
            position: absolute;
            height: 80px;
            width: 10px;
            border-radius: 5px;
            bottom: -70px;
            left: 45px;
            transform: rotate(-15deg);
            transform-origin: top;
            animation: tail 4s infinite;
        }

        @keyframes tail {
            50% {
                transform: rotate(10deg);
            }
        }

        /* ═══════════════════════════════════════════════════════════
           OREJAS (del CSS original - IDÉNTICO)
           ═══════════════════════════════════════════════════════════ */
        .ear {
            height: 0;
            width: 0;
            border-right: 33px solid transparent;
            position: relative;
            bottom: 12px;
        }

        /* Color de orejas - Dark mode */
        .scene--dark .ear {
            border-bottom: 40px solid #2d2623;
        }

        .scene--dark .ear:before {
            border-bottom: 40px solid #2d2623;
        }

        /* Color de orejas - Light mode */
        .scene--light .ear {
            border-bottom: 40px solid #ff8c42;
        }

        .scene--light .ear:before {
            border-bottom: 40px solid #ff8c42;
        }

        .ear:before {
            content: "";
            position: absolute;
            height: 0;
            width: 0;
            border-left: 33px solid transparent;
            bottom: -40px;
            left: 17px;
        }

        /* ═══════════════════════════════════════════════════════════
           LUNA (solo modo dark - del CSS original - IDÉNTICO)
           ═══════════════════════════════════════════════════════════ */
        .moon {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            background-color: transparent;
            box-shadow: -15px 8px 0 1px #e8ae4a;
            position: absolute;
            left: 50px;
            top: 60px;
        }

        /* ═══════════════════════════════════════════════════════════
           ESTRELLAS (solo modo dark - del CSS original - IDÉNTICO)
           ═══════════════════════════════════════════════════════════ */
        .star {
            background-color: #e8ae4a;
            height: 6px;
            width: 6px;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 140px;
            box-shadow: 80px 65px #e8ae4a, -120px 150px #e8ae4a, -80px 280px #e8ae4a,
                70px 235px #e8ae4a, 40px 135px #e8ae4a;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            50% {
                opacity: 0.4;
            }
        }

        /* ═══════════════════════════════════════════════════════════
           SOL (solo modo light - nuevo)
           ═══════════════════════════════════════════════════════════ */
        .sun {
            position: absolute;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffeb3b 0%, #ffc107 100%);
            box-shadow: 0 0 40px rgba(255, 235, 59, 0.8);
            top: 60px;
            right: 50px;
        }

        /* ═══════════════════════════════════════════════════════════
           SUELO/CÉSPED (solo modo light - nuevo)
           ═══════════════════════════════════════════════════════════ */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #7cb342 0%, #558b2f 100%);
        }

        .ground:before {
            content: "🌸";
            position: absolute;
            font-size: 18px;
            bottom: 15px;
            left: 50px;
        }

        .ground:after {
            content: "🌼";
            position: absolute;
            font-size: 16px;
            bottom: 20px;
            right: 60px;
        }

        /* ═══════════════════════════════════════════════════════════
           ANIMACIÓN DE ENTRADA
           ═══════════════════════════════════════════════════════════ */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .toggle-wrapper {
            animation: fadeIn 0.4s ease;
        }
    </style>
</head>

<body class="dark">
    <div class="toggle-wrapper" id="toggleWrapper">
        <div class="scenes-container">
            <!-- ═══════════════════════════════════════════════════════
                 ESCENA DARK (del index.html original - IDÉNTICA)
                 ══════════════════════════════════════════════════════ -->
            <div class="scene scene--dark">
                <div class="container">
                    <div class="window">
                        <div class="mountain-1"></div>
                        <div class="mountain-2"></div>
                        <div class="kitty">
                            <div class="ear"></div>
                        </div>
                        <div class="moon"></div>
                        <div class="star"></div>
                    </div>
                </div>
            </div>

            <!-- ═══════════════════════════════════════════════════════
                 ESCENA LIGHT (misma estructura, diferentes elementos)
                 ══════════════════════════════════════════════════════ -->
            <div class="scene scene--light">
                <div class="container">
                    <div class="window">
                        <div class="ground"></div>
                        <div class="kitty">
                            <div class="ear"></div>
                        </div>
                        <div class="sun"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Detectar tema desde parámetro URL
        const urlParams = new URLSearchParams(window.location.search);
        const newTheme = urlParams.get('theme') || 'light';

        // Aplicar tema inicial
        document.body.className = newTheme;

        // Handler de click para toggle manual (opcional)
        const toggle = document.getElementById('toggleWrapper');

        toggle.addEventListener('click', function () {
            const currentTheme = document.body.classList.contains('light') ? 'light' : 'dark';
            const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.className = nextTheme;
            console.log(`Switching to ${nextTheme} mode`);
        });

        // Auto-cerrar después de 2 segundos
        setTimeout(() => {
            if (window.close) window.close();
        }, 2000);
    </script>
</body>

</html>
