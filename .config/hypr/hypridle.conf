general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh   # bloqueo con video; cae a hyprlock si falla
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = ~/.config/hypr/scripts/hypr-do.sh dpms on && hyprctl setcursor  # to avoid having to press a key twice to turn on the display.
}

# === MONITOR DIM ===
listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# === LOCKSCREEN ===
listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# === TURN OFF SCREEN ===
# Con batería se apaga a los 5.5 min; enchufado el video sigue hasta los 20 min.
listener {
    timeout = 330
    on-timeout = [ "$(cat /sys/class/power_supply/ADP1/online)" = 0 ] && ~/.config/hypr/scripts/hypr-do.sh dpms off
    on-resume = ~/.config/hypr/scripts/hypr-do.sh dpms on && brightnessctl -r
}

listener {
    timeout = 1200
    on-timeout = ~/.config/hypr/scripts/hypr-do.sh dpms off
    on-resume = ~/.config/hypr/scripts/hypr-do.sh dpms on && brightnessctl -r
}

# === SUSPEND ===
listener {
    timeout = 1800                                # 30min
    on-timeout = ~/.config/hypr/scripts/suspend-if-battery.sh   # suspender solo con batería (enchufado: acceso remoto)
}
