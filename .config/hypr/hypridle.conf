general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = ~/.config/hypr/scripts/hypr-do.sh dpms on && hyprctl setcursor  # to avoid having to press a key twice to turn on the display.
}

# === MONITOR DIM ===
listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# === LOCKSCREEN ===
listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# === TURN OFF SCREEN ===
listener {
    timeout = 330                                                     # 5.5min
    on-timeout = ~/.config/hypr/scripts/hypr-do.sh dpms off                            # screen off when timeout has passed
    on-resume = ~/.config/hypr/scripts/hypr-do.sh dpms on && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

# === SUSPEND ===
listener {
    timeout = 1800                                # 30min
    on-timeout = ~/.config/hypr/scripts/suspend-if-battery.sh   # suspender solo con batería (enchufado: acceso remoto)
}
