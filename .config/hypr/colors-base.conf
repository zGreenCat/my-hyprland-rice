# ════════════════════════════════════════════════════════════════════════
#  🌌 Space Theme Colors - Base Purple Palette
#  Estos colores serán reemplazados por Matugen cuando cambies wallpaper
# ════════════════════════════════════════════════════════════════════════

# Primary Colors - Morados espaciales
$primary = rgb(9d4edd)          # Morado vibrante
$secondary = rgb(7b2cbf)        # Morado oscuro
$accent = rgb(c77dff)           # Morado claro
$tertiary = rgb(5a189a)         # Morado profundo

# Background Colors - Cosmos oscuro
$background = rgb(10002b)       # Casi negro morado
$surface = rgb(240046)          # Morado oscuro superficie
$surface_variant = rgb(3c096c)  # Morado medio

# Text Colors
$on_primary = rgb(ffffff)       # Blanco para texto en primary
$on_surface = rgb(e0aaff)       # Morado muy claro para texto
$on_background = rgb(e0aaff)    # Igual que on_surface

# Accent Colors
$error = rgb(ff006e)            # Rosa/rojo para errores
$warning = rgb(fb5607)          # Naranja para warnings
$success = rgb(06ffa5)          # Verde cyan para success
$info = rgb(00b4d8)             # Azul cyan para info

# Border Colors
$border = rgb(5a189a)           # Morado para bordes
$border_active = rgb(c77dff)    # Morado claro para activo
