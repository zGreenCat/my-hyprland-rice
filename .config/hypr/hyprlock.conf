# Space Theme Hyprlock Configuration
source = ~/.config/hypr/colors.conf

general {
    grace = 2
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/current_wallpaper
    color = rgb(10002b)
    
    blur_size = 5
    blur_passes = 3
    noise = 0.0117
    contrast = 1.2
    brightness = 0.7
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +"%H:%M")</big></b>"
    color = rgba(c77dffff)
    font_size = 120
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +"%A, %d %B %Y")</b>"
    color = rgba(e0aaffff)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = rgba(7b2cbfff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    
    outer_color = rgba(7b2cbfff)
    inner_color = rgba(240046ff)
    font_color = rgba(c77dffff)
    
    fade_on_empty = false
    placeholder_text = <span foreground="##e0aaff">󰌾 Password</span>
    font_family = JetBrainsMono Nerd Font
    
    position = 0, -150
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:5000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo 'N/A')%"
    color = rgba(5a189aff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}

# System info
label {
    monitor =
    text = 󰣇 Hyprland
    color = rgba(5a189aff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -30, 30
    halign = right
    valign = bottom
}
