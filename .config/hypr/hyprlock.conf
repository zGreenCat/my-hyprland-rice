# Space Theme Hyprlock - Minimal
source = ~/.config/hypr/colors.conf

general {
    grace = 2
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/current_wallpaper
    color = rgb(10002b)
    
    blur_size = 5
    blur_passes = 3
    noise = 0.0117
    contrast = 1.2
    brightness = 0.7
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# Time - Grande y centrado
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(ffffffff)
    font_size = 180
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(ffffffff)
    font_size = 180
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -80
    halign = center
    valign = center
}

# Date - Más pequeño debajo
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A")"
    color = rgba(ccccccff)
    font_size = 24
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%d %b")"
    color = rgba(ccccccff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, -230
    halign = center
    valign = center
}

# Input field - casi invisible
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    
    outer_color = rgba(ffffff33)
    inner_color = rgba(00000066)
    font_color = rgba(ffffffff)
    
    fade_on_empty = true
    placeholder_text = 
    font_family = JetBrainsMono Nerd Font Mono
    
    position = 0, -320
    halign = center
    valign = center
}
