# ════════════════════════════════════════════════════════════════════════
#  🌌 SPACE HYPRLAND RICE - Main Configuration
#  Temática espacial con colores dinámicos
# ════════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────────
#  🎨 COLORS - Generados dinámicamente por Matugen
# ────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/colors.conf


# ────────────────────────────────────────────────────────────────────────
#  🖥️ MONITORS
# ────────────────────────────────────────────────────────────────────────
monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1  # Segundo monitor


# ────────────────────────────────────────────────────────────────────────
#  📦 MY PROGRAMS
# ────────────────────────────────────────────────────────────────────────
$terminal = kitty
$fileManager = nautilus
$menu = rofi -show drun


# ────────────────────────────────────────────────────────────────────────
#  🚀 AUTOSTART
# ────────────────────────────────────────────────────────────────────────
exec-once = nm-applet              # Network Manager
exec-once = GDK_BACKEND=wayland waybar  # Status bar
exec-once = awww-daemon            # Wallpaper daemon (swww para transiciones)
exec-once = blueman-applet         # Bluetooth
exec-once = GDK_BACKEND=wayland swaync  # Notification center
exec-once = systemctl --user start hyprpolkitagent  # Polkit
exec-once = hypridle               # Idle management
#exec-once = swayosd-server         # OSD notifications for volume/brightness
exec-once = batsignal -w 30 -c 15 -d 8
# Restaurar el wallpaper del tema activo (los colores ya persisten en disco)
exec-once = ~/.config/hypr/scripts/restore-wallpaper.sh
exec-once = xsettingsd
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


# ────────────────────────────────────────────────────────────────────────
#  🌍 ENVIRONMENT VARIABLES
# ────────────────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,Bibata-Modern-Classic
# ⚠️ Nvidia GPU detected - Variables críticas
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = AQ_FORCE_LINEAR_BLIT, 0
env = WLR_NO_HARDWARE_CURSORS,1
env = AQ_NO_HARDWARE_CURSORS,1




# 🦊 Forzar Wayland en Firefox
env = MOZ_ENABLE_WAYLAND,1


# ────────────────────────────────────────────────────────────────────────
#  📋 TAGS (Workspace organization)
# ────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/configs/tags.conf


# ────────────────────────────────────────────────────────────────────────
#  🎨 LOOK AND FEEL
# ────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/configs/looknfeel.conf


# ────────────────────────────────────────────────────────────────────────
#  ✨ ANIMATIONS - Estilo espacial suave
# ────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/configs/UserAnimations.conf


# ────────────────────────────────────────────────────────────────────────
#  🪟 WINDOW RULES
# ────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/configs/windowrules.conf


# ────────────────────────────────────────────────────────────────────────
#  🖱️ INPUT (Keyboard, Mouse, Touchpad)
# ────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/configs/input.conf


# ────────────────────────────────────────────────────────────────────────
#  ⌨️ KEYBINDINGS
# ────────────────────────────────────────────────────────────────────────
source = ~/.config/hypr/configs/keybinds.conf


# ────────────────────────────────────────────────────────────────────────
#  📐 LAYOUTS
# ────────────────────────────────────────────────────────────────────────

# Dwindle Layout (default)
dwindle {
    preserve_split = true
    # no_gaps_when_only = false  # Opción removida en Hyprland 0.52+  # Siempre mostrar gaps
}

# Master Layout
master {
    new_status = master
    new_on_top = false
}


# ────────────────────────────────────────────────────────────────────────
#  🔧 MISC
# ────────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = 0       # Sin wallpaper de Hyprland
    disable_hyprland_logo = true      # Sin logo
    vrr = 0                           # Variable refresh rate
    mouse_move_enables_dpms = true    # Wake on mouse move
    key_press_enables_dpms = true     # Wake on keypress
}

render {
    new_render_scheduling = true
}

