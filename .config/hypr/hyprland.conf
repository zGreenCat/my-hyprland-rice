########################
#  Hyprland minimal   #
########################

# --- Entorno base ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Nvidia: evitar problemas con el cursor
env = WLR_NO_HARDWARE_CURSORS,1

# --- Autostart básico ---
exec-once = waybar
#exec-once = nm-applet
exec-once = pasystray
exec-once = hyprpaper
exec-once = swaync
# --- Workspaces con nombres/íconos ---
workspace = 1, name: term
workspace = 2, name: web
workspace = 3, name: code
workspace = 4, name: media
workspace = 5, name: game


# --- Atajos mínimos (por si no vienen por defecto) ---
# Super = tecla Windows
bind = SUPER, RETURN, exec, kitty
bind = SUPER, Q, killactive
bind = SUPER, C, exec, wofi --show drun
bind = SUPER, E, exec, nautilus
bind = SUPER, V, togglefloating
bind = SUPER, F, fullscreen
bind = SUPER, SPACE, togglefloating
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER, L, exec, hyprlock
bind = SUPER, X, exec, wlogout
# Print = captura pantalla completa a archivo
bind = SUPER, Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SUPER SHIFT, N, exec, swaync-client -d -c

# Super+Print = seleccionar área y editar en swappy
bind =, Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SUPER, N, exec, swaync-client -t


# --- Apariencia general ---
general {
    gaps_in = 8
    gaps_out = 18
    border_size = 3
    layout = dwindle

    col.active_border = 0xffb4befe 0xff89b4fa 270deg
    col.inactive_border = 0xff1e1e2e
}
decoration {
    rounding = 12

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
}

# --- Opacidad por aplicación ---
# formato: windowrulev2 = opacity <activa> <inactiva>, class:^(NOMBRE)$

windowrulev2 = opacity 0.85 0.80, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(firefox)$
windowrulev2 = opacity 0.92 0.88, class:^(code-oss)$



animations {
    enabled = true

    bezier = easeOut, 0.05, 0.9, 0.1, 1.0

    animation = windows, 1, 5, easeOut, slide
    animation = windowsOut, 1, 4, easeOut, slide
    animation = border, 1, 5, easeOut
    animation = fade, 1, 7, easeOut
    animation = workspaces, 1, 6, easeOut, slide
}

# Layout teclado (por si no lo pusimos antes)
input {
    kb_layout = us
}

monitor = eDP-1,preferred,auto,1
