###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, [float; size 800 550] $terminal 
bind = $mainMod, Q, killactive,
bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0 # exit Hyprland
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, togglefloating,
bind = $mainMod, C, exec, $menu                        # CAMBIADO: Buscador de apps
bind = $mainMod, TAB, exec, ~/.config/hypr/scripts/omenu.sh    # Menú con submenus
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, R, exec, ~/.config/hypr/scripts/wbrestart.sh
bind = $mainMod, B, exec, xdg-open "https://"  # default browser
bind = $mainMod, L, exec, hyprlock  # Lock screen
bind = $mainMod, X, exec, wlogout  # Power menu
bind = $mainMod, F, fullscreen                         # CAMBIADO: Fullscreen sin Shift
bind = $mainMod, T, exec, python3 ~/.config/hypr/scripts/cat-theme-widget.py # 🐈 Cat theme toggle con transición circular
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/KillActiveProcess.sh # Kill active process
bind = $mainMod SHIFT, C, exec, hyprpicker -a          # Color picker movido a Shift+C
bind = $mainMod CTRL, B, exec, ~/.config/hypr/scripts/WaybarStyles.sh # Waybar Styles Menu
bind = $mainMod ALT, B, exec, ~/.config/hypr/scripts/WaybarLayout.sh # Waybar Layout Menu
bind = $mainMod, H, exec, pkill -SIGUSR1 waybar # Hide Waybar
bind = $mainMod SHIFT, E, exec, kitty yazi # Yazi File Manager
bind = $mainMod SHIFT, M, exec, kitty yt # YouTube Music TUI
bind = $mainMod, M, exec, kitty spt # Spotify TUI (estilo de la foto)


# Asistente de voz (Alt+Z x2: inicia/para grabación → Claude Code → TTS)
bind = ALT, Z, exec, python3 ~/.config/hypr/scripts/voice-assistant.py

# Widgets - Visualizadores
bind = $mainMod SHIFT, V, exec, [float; size 800 400] kitty --title "Cava Audio Visualizer" cava # Audio visualizer
bind = $mainMod SHIFT, B, exec, [float; size 1200 800] kitty --title "Btop System Monitor" btop # System monitor
bind = $mainMod SHIFT, T, exec, [float; size 600 300] kitty --title "TTY Clock" tty-clock -c -C 5 -B # Big clock

# Screenshots - CAMBIADO: Imp Pnt directo al portapapeles
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod CTRL, Print, exec, sleep 3 && grim - | swappy -f -

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move  Windows
bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

# Resize windows
binde = $mainMod SHIFT, left, resizeactive,-50 0
binde = $mainMod SHIFT, right, resizeactive,50 0
binde = $mainMod SHIFT, up, resizeactive,0 -50
binde = $mainMod SHIFT, down, resizeactive,0 50

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad terminal (Super + grave)
bind = $mainMod, grave, exec, ~/.config/hypr/scripts/scratchpad.sh

# Clipboard manager (Super + V)
bind = $mainMod, V, exec, ags toggle clipboard

# Notification center and quick settings (Super + S)
bind = $mainMod, S, exec, ags toggle notification-center

# Project launcher (Super + P)
bind = $mainMod, P, exec, ~/.config/hypr/scripts/project-launcher.sh

# Quick note to Obsidian Inbox (Super + N)
bind = $mainMod, N, exec, ~/.config/hypr/scripts/quick-note.sh

# Obsidian hub — reunión / decisión / vault (Super + O)
bind = $mainMod, O, exec, ~/.config/hypr/scripts/obsidian-hub.sh

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ════════════════════════════════════════════════════════════════════════
#  🔊 AUDIO & BRILLO (Usando scripts nativos del Rice)
# ════════════════════════════════════════════════════════════════════════

# Control de Volumen (Sube hasta 150% con notificaciones)
# Control de Volumen (Sube hasta 150% con notificaciones)
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh --inc
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh --dec
bindel = , XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh --toggle


# Control de Micrófono
bindel = , XF86AudioMicMute, exec, ~/.config/hypr/scripts/volume.sh --toggle-mic

# Control de Brillo
bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh --inc
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh --dec

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ════════════════════════════════════════════════════════════════════════
#  🖥️ MULTI-MONITOR - Mover ventanas entre monitores
# ════════════════════════════════════════════════════════════════════════

# Mover ventana al monitor izquierdo/derecho
bind = $mainMod SHIFT, H, movewindow, mon:l  # Monitor izquierdo
bind = $mainMod SHIFT, L, movewindow, mon:r  # Monitor derecho

# Mover workspace al monitor siguiente
bind = $mainMod CTRL SHIFT, right, movecurrentworkspacetomonitor, r
bind = $mainMod CTRL SHIFT, left, movecurrentworkspacetomonitor, l

# Mover foco entre monitores
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, right, focusmonitor, r

# Mover ventana Y cambiar al workspace en el otro monitor
bind = $mainMod ALT SHIFT, 1, movetoworkspace, 1
bind = $mainMod ALT SHIFT, 2, movetoworkspace, 2
bind = $mainMod ALT SHIFT, 3, movetoworkspace, 3
bind = $mainMod ALT SHIFT, 4, movetoworkspace, 4
bind = $mainMod ALT SHIFT, 5, movetoworkspace, 5

# Multi-monitor - Mover ventanas entre monitores
bind = $mainMod SHIFT, H, movewindow, mon:l
bind = $mainMod SHIFT, L, movewindow, mon:r
bind = $mainMod CTRL SHIFT, right, movecurrentworkspacetomonitor, r
bind = $mainMod CTRL SHIFT, left, movecurrentworkspacetomonitor, l
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, right, focusmonitor, r

# ════════════════════════════════════════════════════════════════════════
#  📦 WORKSPACE - Mover ventana y seguirla
# ════════════════════════════════════════════════════════════════════════

# Mover ventana a workspace Y seguirla (Super + Ctrl + 1-5)
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 1, workspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 2, workspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 3, workspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 4, workspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 5, workspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 6, workspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 7, workspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 8, workspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 9, workspace, 9

# Mover ventana Y seguirla (Super + Ctrl + Número)
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 1, workspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 2, workspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 3, workspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 4, workspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 5, workspace, 5

# Meeting mode: toggle workspace 8 en monitor headless para compartir pantalla
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/meeting-mode.sh
