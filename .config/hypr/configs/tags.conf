# ~/.config/hypr/configs/tags.conf

windowrule = tag +multimedia_video, match:class ^([Mm]pv|vlc)$

windowrule = tag +settings, match:class ^(nm-applet|nm-connection-editor|blueman-manager|org\.gnome\.FileRoller)$
windowrule = tag +settings, match:class ^(org\.gnome\.DiskUtility|wihotspot(-gui)?)$

windowrule = tag +viewer, match:class ^(org\.gnome\.SystemMonitor)$ # system monitor
windowrule = tag +viewer, match:class ^(org\.gnome\.Evince)$       # document viewer 
windowrule = tag +viewer, match:class ^(eog|org\.gnome\.Loupe)$    # image viewer
# Fijar workspaces al monitor de la laptop (ej: eDP-1)
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1

# Fijar workspaces al monitor externo (ej: HDMI-A-1)
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
