input {
    kb_layout = us,latam
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    force_no_accel = 1

    touchpad {
        natural_scroll = true
    }
}

cursor {
    no_hardware_cursors = true
}

# Gestures removido en Hyprland 0.52+
# Las opciones de gestures ahora están en input:touchpad

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
