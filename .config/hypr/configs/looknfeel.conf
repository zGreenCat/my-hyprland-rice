# ════════════════════════════════════════════════════════════════════════
#  🎨 Look and Feel - Space Theme (Dynamic Colors)
# ════════════════════════════════════════════════════════════════════════

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 3
    
    # Bordes con colores dinámicos del wallpaper
    col.active_border = $color_active_border_1 $color_active_border_2 $color_active_border_3 45deg
    col.inactive_border = $color_inactive_border
    
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    
    active_opacity = 0.98
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0
    
    shadow {
        enabled = true
        range = 20
        render_power = 3
        offset = 0 2
        color = rgba(10002b99)
        color_inactive = rgba(10002b66)
    }
    
    blur {
        enabled = true
        size = 8
        passes = 3
        ignore_opacity = true
        new_optimizations = true
        xray = true
        contrast = 1.1
        brightness = 1.0
        vibrancy = 0.2
        vibrancy_darkness = 0.3
    }
    
    dim_inactive = true
    dim_strength = 0.05
}

dwindle {
    pseudotile = true
    preserve_split = true
}
