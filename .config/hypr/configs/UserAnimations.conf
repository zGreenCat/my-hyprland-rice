# ════════════════════════════════════════════════════════════════════════
#  ✨ Animations - Space Theme (Suaves y flotantes como en el espacio)
# ════════════════════════════════════════════════════════════════════════

animations {
    enabled = true
    
    # Bezier curves para movimientos espaciales suaves
    bezier = space, 0.05, 0.9, 0.1, 1.02          # Suave y flotante
    bezier = spaceIn, 0.16, 1, 0.3, 1              # Entrada suave
    bezier = spaceOut, 0.7, 0, 0.84, 0             # Salida suave
    bezier = fade, 0.25, 0.1, 0.25, 1              # Fade suave
    bezier = linear, 0, 0, 1, 1                    # Linear para bordes
    bezier = float, 0.4, 0, 0.2, 1                 # Efecto flotante
    bezier = cosmic, 0.68, -0.55, 0.265, 1.55      # Efecto cósmico con bounce ligero
    
    # Windows - Entrada y salida suave como flotando en el espacio
    animation = windowsIn, 1, 6, spaceIn, popin 90%
    animation = windowsOut, 1, 5, spaceOut, popin 90%
    animation = windowsMove, 1, 5, space, slide
    
    # Fade - Transiciones de opacidad muy suaves
    animation = fadeIn, 1, 6, fade
    animation = fadeOut, 1, 5, fade
    animation = fade, 1, 6, fade
    animation = fadeDim, 1, 6, fade
    animation = fadeSwitch, 1, 5, fade
    animation = fadeShadow, 1, 5, fade
    animation = fadeLayersIn, 1, 5, fade
    animation = fadeLayersOut, 1, 5, fade
    
    # Borders - Transición rápida pero suave
    animation = border, 1, 4, linear
    animation = borderangle, 1, 100, linear, loop
    
    # Workspaces - Deslizamiento espacial suave
    animation = workspaces, 1, 7, space, slide
    animation = specialWorkspace, 1, 6, cosmic, slidevert
}
