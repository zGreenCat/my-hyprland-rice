# APPLICATIONS BLUR
windowrule = no_blur on, match:tag multimedia_video*
windowrule = opacity 1.0, match:tag multimedia_video*
windowrule = opacity 0.8, match:tag settings*
windowrule = opacity 0.8, match:class ^(org\.gnome\.Nautilus)$
windowrule = opacity 0.9, match:class ^(gedit|org\.gnome\.TextEditor|mousepad)$
windowrule = opacity 0.9, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = opacity 0.9, match:class ^(kitty)$
windowrule = opacity 0.85 override 0.7 override 1 override, match:class ^(discord|vesktop|org\.telegram\.desktop)$
windowrule = opacity 0.8 override 0.6 override 1 override, match:class ^(Spotify)$
windowrule = opacity 0.9 override 0.7 override 1 override, match:class ^(zen)$

# Firefox
windowrule = opacity 0.95 override 0.90 override, match:class ^(firefox)$
windowrule = opacity 0.95 override 0.90 override, match:class ^(Navigator)$

# Asistente de Voz
windowrule = float on,            match:title ^(Asistente de Voz)$
windowrule = size 520 300,        match:title ^(Asistente de Voz)$
windowrule = move 20 760,          match:title ^(Asistente de Voz)$
windowrule = opacity 0.95 override, match:title ^(Asistente de Voz)$
windowrule = decorate off,        match:title ^(Asistente de Voz)$
windowrule = pin on,              match:title ^(Asistente de Voz)$
windowrule = animation slide,     match:title ^(Asistente de Voz)$

# 🐈 Cat Theme Toggle Widget
windowrule = float on, match:title ^(Cat Theme Toggle)$
windowrule = size 280 420, match:title ^(Cat Theme Toggle)$
windowrule = center on, match:title ^(Cat Theme Toggle)$
windowrule = opacity 0.98 override, match:title ^(Cat Theme Toggle)$
windowrule = decorate off, match:title ^(Cat Theme Toggle)$
windowrule = animation slide, match:title ^(Cat Theme Toggle)$

# Legacy: Theme card anterior
windowrule = float on, match:title ^(Theme Toggle)$
windowrule = size 140 180, match:title ^(Theme Toggle)$
windowrule = center on, match:title ^(Theme Toggle)$
windowrule = opacity 0.95 override, match:title ^(Theme Toggle)$
windowrule = decorate off, match:title ^(Theme Toggle)$
windowrule = no_anim on, match:title ^(Theme Toggle)$

# LAYER RULES
# (descomentando estos ajusta rofi/notificaciones si los necesitas)
#layerrule = blur on, match:namespace rofi
#layerrule = ignore_alpha 0.5, match:namespace rofi
#layerrule = dim_around on, match:namespace rofi
#layerrule = animation popin, match:namespace rofi

layerrule = blur on,          match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace tag:notif*
layerrule = blur on,          match:namespace logout_dialog

# SWAYNC BLUR & XRAY
layerrule = blur on,          match:namespace swaync-control-center
layerrule = blur on,          match:namespace swaync-notification-window
layerrule = ignore_alpha 0,   match:namespace swaync-control-center      # antes ignorezero
layerrule = ignore_alpha 0,   match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = xray 0,           match:namespace swaync-control-center
layerrule = xray 0,           match:namespace swaync-notification-window

# FLOAT POR TAG / APPS
windowrule = float on, match:tag settings*
windowrule = float on, match:tag viewer*
windowrule = float on, match:tag multimedia_video*
windowrule = size 900 506, match:tag multimedia_video*
windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = size 50% 60%, match:class ^(org\.pulseaudio\.pavucontrol)$

# Scratchpad terminal
windowrule = workspace special:scratchpad silent, match:class ^(scratchpad)$
windowrule = float on, match:class ^(scratchpad)$
windowrule = size 80% 45%, match:class ^(scratchpad)$
windowrule = center 1, match:class ^(scratchpad)$

# Quick Settings popup
windowrule = float on, match:title ^(Quick Settings)$
windowrule = size 340 420, match:title ^(Quick Settings)$
windowrule = move 100%-360 50, match:title ^(Quick Settings)$

# Ignorar peticiones de maximizar de las apps
windowrule = match:class .*, suppress_event maximize

# Fix dragging issues XWayland (regla por defecto de Hyprland nueva)
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false, no_focus on

# POP UPS AND DIALOGUES
windowrule = float on, match:title ^(Save As|Save a File|Pick Files)$
windowrule = size 50% 60%, match:title ^(Save As|Save a File|Pick Files)$
windowrule = center on, match:title ^(Save As|Save a File|Pick Files)$

windowrule = float on, match:initial_title (Open Files)
windowrule = size 70% 60%, match:initial_title (Open Files)
